[project]
name = "multi-agent-sdlc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipython>=9.16.0",
    "langchain>=1.3.14",
    "langchain-core>=1.5.1",
    "langchain-openrouter>=0.2.7",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.2.2",
    "reportlab>=5.0.0",
    "ruff>=0.16.1",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multi_agent_sdlc"]

[project.scripts]
multi-agent-sdlc = "multi_agent_sdlc.main:run"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = [
    "--cov=multi_agent_sdlc",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]

[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E", "F", "W"] 
[tool.ruff.lint.pycodestyle]
max-doc-length = 120
